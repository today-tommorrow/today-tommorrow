name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Formatting
        id: formatting
        if: ${{ !cancelled() }}
        run: |
          npm run format:check
          npx --no-install prettier --check vitest.config.ts
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Prepare formatting correction artifact
        if: ${{ failure() && steps.formatting.outcome == 'failure' }}
        run: |
          npx --no-install prettier --write src index.html vite.config.ts vitest.config.ts tsconfig.json package.json eslint.config.js .prettierrc.json
          git diff -- src index.html vite.config.ts vitest.config.ts tsconfig.json package.json eslint.config.js .prettierrc.json > formatting.patch
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.formatting.outcome == 'failure' }}
        with:
          name: formatting-correction
          path: web/formatting.patch
          retention-days: 3

  integration:
    name: Real API and database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: today
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: today
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U today -d today"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://today:ci-only@127.0.0.1:5432/today
      API_TARGET: http://127.0.0.1:8000
      WEB_PORT: '5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked runtimes and dependencies
        run: |
          uv python install "$(cat .python-version)"
          uv sync --project backend --locked --dev --python "$(cat .python-version)"
          npm ci --prefix web
      - name: Apply actual database migrations
        working-directory: backend
        run: uv run --no-sync alembic upgrade head
      - name: Start real API and Vite proxy
        run: |
          (cd backend && uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1) &
          npm run dev --prefix web -- --host 127.0.0.1 > "$RUNNER_TEMP/web.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 5 --max-time 10 http://127.0.0.1:5173/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Real frontend HTTP integration tests
        working-directory: web
        run: npm test -- --config vitest.config.ts
      - name: Verify actual database outage and recovery
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker stop "$POSTGRES_CONTAINER"
          status=$(curl --silent --connect-timeout 5 --max-time 10 --output "$RUNNER_TEMP/db-outage.json" --write-out '%{http_code}' http://127.0.0.1:5173/api/health)
          test "$status" = 503
          jq -e '.detail == "database_unavailable"' "$RUNNER_TEMP/db-outage.json"
          docker start "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 5 --max-time 10 http://127.0.0.1:5173/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Record verification boundaries
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Real services: Vite proxy → FastAPI → PostgreSQL 17.11, migrations, database outage/recovery.
          No mock responses, sample courses, generated profiles or authentication credentials are used.
          OAuth, profile, question, document and recommendation endpoints are not implemented in this baseline backend.
          Their complete UI/API/OAuth/GPU integration remains unverified. GPU: N/A for this CI job.
          Existing mocked backend and launcher unit suites are intentionally not executed by this workflow.
          SUMMARY
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: real-integration-logs
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/db-outage.json
          retention-days: 3
