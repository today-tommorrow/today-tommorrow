name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Formatting
        id: formatting
        if: ${{ !cancelled() }}
        run: |
          npm run format:check
          npx --no-install prettier --check vitest.config.ts
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Input preservation and runtime configuration regressions
        if: ${{ !cancelled() }}
        run: npm test -- src/Intake.test.tsx vitest.config.test.ts
      - name: Prepare formatting correction artifact
        if: ${{ failure() && steps.formatting.outcome == 'failure' }}
        run: |
          npx --no-install prettier --write src index.html vite.config.ts vitest.config.ts tsconfig.json package.json eslint.config.js .prettierrc.json
          git diff -- src index.html vite.config.ts vitest.config.ts tsconfig.json package.json eslint.config.js .prettierrc.json > formatting.patch
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.formatting.outcome == 'failure' }}
        with:
          name: formatting-correction
          path: web/formatting.patch
          retention-days: 3

  integration:
    name: Real API and database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: today_bootstrap
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: work24_dev
      DB_PORT: "55432"
      CATALOG_DATABASE_URL: postgresql://today_bootstrap:ci-only@127.0.0.1:55432/work24_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg://today_migrator:ci-migration@127.0.0.1:55432/work24_dev
      DATABASE_URL: postgresql+psycopg://today_app:ci-app@127.0.0.1:55432/work24_dev
      L0_DATABASE_TESTS: "1"
      L0_REIMPORT_TESTS: "1"
      API_TARGET: http://127.0.0.1:8000
      WEB_PORT: "5273"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked runtimes and dependencies
        run: |
          uv python install "$(cat .python-version)"
          uv sync --project backend --locked --dev --python "$(cat .python-version)"
          uv sync --project tools/catalog --locked --python "$(cat .python-version)"
          npm ci --prefix web
      - name: Prepare actual PostgreSQL 16 and pinned education data
        run: |
          docker compose --env-file /dev/null up -d --build --wait db
          uv run --project tools/catalog --no-sync python tools/catalog/bootstrap.py --report .local/catalog/ci-bootstrap.json
      - name: Apply actual database migrations
        working-directory: backend
        run: uv run --no-sync alembic upgrade head
      - name: Python static and unit checks
        working-directory: backend
        run: |
          uv run --no-sync ruff check --config pyproject.toml . ../scripts ../tools/catalog
          uv run --no-sync python -m unittest discover -s tests
          uv run --no-sync python -m unittest discover -s ../scripts -p 'test_*.py'
          uv run --project ../tools/catalog --no-sync python -m unittest discover -s ../tools/catalog/tests
          uv run --project ../tools/catalog --no-sync python -m unittest discover -s ../tools/catalog/integration
      - name: Start real API and Vite proxy
        run: |
          (
            cd backend
            exec .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1
          ) &
          echo "$!" > "$RUNNER_TEMP/api.pid"
          (
            cd web
            exec node node_modules/vite/bin/vite.js --host 127.0.0.1 > "$RUNNER_TEMP/web.log" 2>&1
          ) &
          echo "$!" > "$RUNNER_TEMP/web.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 5 --max-time 10 "http://127.0.0.1:$WEB_PORT/api/health"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Full frontend suite including real HTTP integration
        working-directory: web
        run: npm test -- --config vitest.config.ts
      - name: Verify actual database outage and recovery
        run: |
          POSTGRES_CONTAINER=$(docker compose --env-file /dev/null ps -q db)
          docker stop "$POSTGRES_CONTAINER"
          status=$(curl --silent --connect-timeout 5 --max-time 10 --output "$RUNNER_TEMP/db-outage.json" --write-out '%{http_code}' "http://127.0.0.1:$WEB_PORT/api/health")
          test "$status" = 503
          jq -e '.detail == "database_unavailable"' "$RUNNER_TEMP/db-outage.json"
          docker start "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 5 --max-time 10 "http://127.0.0.1:$WEB_PORT/api/health"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Stop integration servers
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          for service in api web; do
            pid_file="$RUNNER_TEMP/$service.pid"
            if [ ! -f "$pid_file" ]; then
              continue
            fi
            server_pid=$(cat "$pid_file")
            if [[ ! "$server_pid" =~ ^[0-9]+$ ]]; then
              continue
            fi
            kill "$server_pid" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if kill -0 "$server_pid" 2>/dev/null; then
              kill -KILL "$server_pid" 2>/dev/null || true
            fi
          done
          docker compose --env-file /dev/null stop db
      - name: Record verification boundaries
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Real services: Vite proxy → FastAPI → PostgreSQL 16.14 + pgvector 0.6.0, migrations, database outage/recovery.
          Pinned real education data: 406 courses, 6099 units; vector round-trip, stored-query exact/HNSW, reimport preservation and app/catalog permission boundaries.
          App.test.tsx uses real HTTP responses. Intake and configuration regressions use isolated synthetic fixtures and do not verify model/API integration.
          Auth checks cover real unauthenticated /auth/me 401 and its login link, plus synthetic Google responses/tokens and local database tests.
          초안·질문·작업 검사는 실제 로컬 PostgreSQL과 합성 서비스 세션·모델 HTTP 응답을 사용하며, 실제 Worker 프로세스 재시작도 확인합니다.
          실제 Google 브라우저 로그인·Gemma·GPU는 미검증입니다. 자료·해석·추천 API와 그 전체 연동은 후속 범위입니다. 이 CI의 GPU 검증은 N/A입니다.
          Python 정적 검사와 backend/launcher 회귀도 실행하며, 실제 DB 결과와 합성 모델 결과를 구분합니다.
          SUMMARY
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: real-integration-logs
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/db-outage.json
            .local/catalog/ci-bootstrap.json
          retention-days: 3
