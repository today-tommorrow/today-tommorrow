          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPatch'
  /profiles/{profile_id}/documents/files:
    post:
      summary: 이력서·JD 등 파일 업로드 후 추출 작업 시작
      operationId: uploadDocumentFile
      description: PDF(스캔 OCR 포함), DOCX, TXT, PNG/JPG 지원을 구현 기본안으로 둔다. 파일 1개씩 multipart,
        복수 자료는 반복 등록. 실제 허용형식·한도는 options에서 조회. 저장 위치는 GPU 서버 비공개 업로드 디렉터리. 확장자/MIME/실제
        내용 검증, 본문 스트리밍 제한. 업로드마다 revision+1.
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Csrf'
      responses:
        '202':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAccepted'
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 또는 접근 거부
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 리소스 없음 또는 다른 사용자 소유
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 입력 버전·자료 처리·확인 토큰 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
