openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 다음 / Today Tommorrow 개발 계약
  version: 0.8.0
  description: v0.8 / 2026-11-01 KST. 선택형 UI 유지, local Gemma가 맥락별 질문과 선택지를 구조화 출력.
    전체 입력 후 교육 추천. v0.7 추천 파이프라인·3원천 적재·저장소 기준 유지. 설계 계약이며 서버 구현 완료 아님.
servers:
- url: /api
security:
- SessionCookie: []
paths:
  /health:
    get:
      summary: 기존 실제 DB 연결 확인 유지
      operationId: health
      description: '기존 main.py 계약 유지. SELECT 1 성공 200. 실패 503 {detail: database_unavailable}.
        일반 신규 API 오류 포맷과 구분.'
      parameters: []
      responses:
        '200':
          description: DB 연결 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: DB 연결 실패
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    enum:
                    - database_unavailable
                required:
                - detail
                additionalProperties: false
      security: []
  /auth/google/start:
    get:
      summary: Google 로그인 시작
      operationId: startGoogleLogin
      description: 서버에서 일회용 state/nonce와 브라우저 바인딩 생성. Google OAuth authorization code
        flow, openid email profile. 성공 후 /onboarding으로 이동. 임의 외부 return URL을 받지 않는다.
      parameters: []
      responses:
        '302':
          description: 성공
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/google/callback:
    get:
      summary: Google 인증 후 계정과 서비스 세션 생성
      operationId: googleCallback
      description: state·브라우저 바인딩·일회성·만료 검증, 서버에서 code 교환, Google 서명/iss/aud/exp/nonce
        확인. google_sub로 users upsert. 성공 Location=/onboarding, 사용자 취소 Location=/login?error=oauth_cancelled.
        code·토큰을 브라우저 응답 본문/로그에 노출하지 않는다.
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: 성공
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: today_session=<opaque>; HttpOnly; Secure(운영); SameSite=Lax;
                Path=/api
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/me:
    get:
      summary: 로그인 사용자와 CSRF 토큰 조회
      operationId: getCurrentUser
      description: ''
      parameters: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 또는 접근 거부
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 리소스 없음 또는 다른 사용자 소유
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 입력 버전·자료 처리·확인 토큰 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: 현재 로그인 세션 종료
      operationId: logout
      description: 현재 세션 폐기와 쿠키 만료. 계정·입력 초안·추천 기록은 삭제하지 않는다.
      parameters:
      - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: 성공
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 또는 접근 거부
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 리소스 없음 또는 다른 사용자 소유
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 입력 버전·자료 처리·확인 토큰 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /onboarding/options:
    get:
      summary: 질문 선택지·파일 지원 범위 조회
      operationId: getOnboardingOptions
      description: ''
      parameters: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingOptions'
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 또는 접근 거부
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 리소스 없음 또는 다른 사용자 소유
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 입력 버전·자료 처리·확인 토큰 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profiles:
    post:
      summary: 로그인 사용자 입력 초안 생성
      operationId: createProfile
      description: users.id가 소유자. 익명 세션 생성 API는 없다.
      parameters:
      - $ref: '#/components/parameters/Csrf'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 또는 접근 거부
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 리소스 없음 또는 다른 사용자 소유
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 입력 버전·자료 처리·확인 토큰 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profiles/{profile_id}:
    get:
      summary: 입력 초안과 자료 처리·확인 상태 조회
      operationId: getProfile
      description: 초안·자료·확인 항목과 서버가 계산한 intake_state를 조회. 질문 본문은 IntakeQuestion에서
        조회한다. GET은 Gemma를 호출하지 않는다. review_token은 모든 적용 항목 완료·상충 해소·자료 확인 후에만 발급한다.
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 또는 접근 거부
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 리소스 없음 또는 다른 사용자 소유
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 입력 버전·자료 처리·확인 토큰 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: 입력 응답 저장
      operationId: patchProfile
      description: answers는 현재까지의 전체 응답 묶음. 버전 일치 시 revision+1, status=draft, 진행 추천
        job은 superseded. 자료 처리 job은 해당 자료가 바뀌거나 삭제되지 않는 한 계속 실행한다. 작성 중에는 빈 항목을 허용하고
        제출 시 완결성을 검증. 이미 입력한 내용은 유지. 분야 변경 시 관련 경험 항목을 재확인 표시하되 업로드 원본을 자동 삭제하지 않는다.
        자유문장 해석을 자동 확정하지 않는다. 명시적 직접 수정이 수락한 해석보다 우선한다. 이전 해석 작업은 stale 처리하고 미정은 같은
        내용으로 반복 질문하지 않는다. 질문 생성 job과 ready 질문도 stale 처리한다. 미정 답변은 unanswered와 구분하고
        재질문하지 않는다.
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 또는 접근 거부
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 리소스 없음 또는 다른 사용자 소유
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 입력 버전·자료 처리·확인 토큰 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 필수 입력·분기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 처리 기능 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
  /profiles/{profile_id}/review-items:
    patch:
      summary: 입력 완료 전 추출 내용 수정
      operationId: patchReviewItems
      description: 원문 인용·document/chunk ID는 서버가 생성하고 클라이언트 수정 불가. 항목 상태와 표시 라벨만 수정.
        revision+1. 결과 화면에서 추가 질문하지 않는다.
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Csrf'
      responses:
