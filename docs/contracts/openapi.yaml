          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 설정된 파일·본문 한도 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 지원하지 않는 파일 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentFileInput'
  /profiles/{profile_id}/documents/links:
    post:
      summary: 공개 링크 본문 수집 후 추출 작업 시작
      operationId: addDocumentLink
      description: 공개 채용공고·이력서·포트폴리오 HTML 또는 지원 문서 링크를 실제 서버에서 읽는다. URL 문자열만 모델에 넘기는
        방식이 아니다. HTTP(S)만, 내부/loopback/link-local/metadata 주소 차단, DNS와 연결 IP 및 redirect
        매 단계 재검증. 제한 초과·로그인벽·수집 차단은 실패 상태와 같은 입력 단계의 파일/텍스트 대체 제공. Google 로그인은 Drive
        파일 권한을 부여하지 않는다.
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Csrf'
      responses:
        '202':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAccepted'
        '400':
          description: 요청 오류
