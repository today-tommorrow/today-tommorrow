components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: today_session
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: GET /api/auth/me에서 조회하는 세션 바인딩 토큰
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - request_id
      additionalProperties: false
    EntryIntent:
      type: string
      enum:
      - goal_known
      - explore
      - advance
    FieldCode:
      type: string
      enum:
      - ai_data
      - software_cloud
      - security_network
      - robotics_manufacturing
      - semiconductor
      - digital_content
      - other
      - undecided
    Evidence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        field_path:
          type: string
        quote:
          anyOf:
          - type: string
          - type: 'null'
        source_url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        source_system:
          type: string
          enum:
          - kmooc
          - work24
          - ncs
        checked_at:
          type: string
          format: date-time
        verification_state:
          type: string
          enum:
          - observed
          - verified
          - unknown
          - conflicting
      required:
      - id
      - field_path
      - quote
      - source_url
      - source_system
      - checked_at
      - verification_state
      additionalProperties: false
    Schedule:
      type: object
      properties:
        days:
          type: array
          items:
            type: string
            enum:
            - mon
