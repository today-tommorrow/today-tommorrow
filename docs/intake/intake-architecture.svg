 Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">소유권 · 버전 · 자료 해시 검사</text><text x="426" y="937" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">한 트랜잭션으로 저장 · revision+1</text><path d="M185 780 L185 905 L410 905" fill="none" stroke="#817994" stroke-width="1.6" marker-end="url(#intake-architecture-arr)"/><text x="238" y="891" font-family="Arial, Noto Sans KR, sans-serif" font-size="12" fill="#7b6374" text-anchor="start" font-weight="400">선택 ID</text><path d="M745 905 L1080 905 L1080 175 L745 175" fill="none" stroke="#817994" stroke-width="1.6" marker-end="url(#intake-architecture-arr)"/><text x="975" y="882" font-family="Arial, Noto Sans KR, sans-serif" font-size="12" fill="#7b6374" text-anchor="start" font-weight="400">다음 질문</text><rect x="35" y="1010" width="1030" height="105" rx="12" fill="#e6f5f1" stroke="#dcd6e7"/><text x="51" y="1039" font-family="Arial, Noto Sans KR, sans-serif" font-size="17" fill="#362d4b" text-anchor="start" font-weight="700">완료 판단은 서버 정책</text><text x="51" y="1062" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">필요 정보·자료 확인 완료 → 전체 확인 화면 → 사용자 최종 제출 → 교육 추천 파이프라인</text><text x="51" y="1082" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">LLM의 done 선언으로 종료하지 않음 · 결과 뒤 추가 질문 없음 · 미정은 미응답과 구분</text><path d="M578 970 L578 1010" fill="none" stroke="#817994" stroke-width="1.6" marker-end="url(#intake-architecture-arr)"/></svg>