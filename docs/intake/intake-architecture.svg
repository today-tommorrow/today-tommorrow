on</text><text x="426" y="207" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">중복 질문 방지 · 다음 행동 결정</text><path d="M335 178 L410 178" fill="none" stroke="#817994" stroke-width="1.6" marker-end="url(#intake-architecture-arr)"/><rect x="410" y="300" width="335" height="115" rx="12" fill="#fff" stroke="#dcd6e7"/><text x="426" y="329" font-family="Arial, Noto Sans KR, sans-serif" font-size="17" fill="#362d4b" text-anchor="start" font-weight="700">질문 생성 Context</text><text x="426" y="352" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">허용 target / companion 슬롯</text><text x="426" y="372" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">확인된 사실과 필요한 원문 일부</text><text x="426" y="392" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">스키마 · 프롬프트 · 정책 버전</text><path d="M578 240 L578 300" fill="none" stroke="#817994" stroke-width="1.6" marker-end="url(#intake-architecture-arr)"/><rect x="35" y="300" width="300" height="115" rx="12" fill="#e6f5f1" stroke="#dcd6e7"/><text x="51" y="329" font-family="Arial, Noto Sans KR, sans-serif" font-size="17" fill="#362d4b" text-anchor="start" font-weight="700">PostgreSQL</text><text x="51" y="352" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">프로필 / 자료 / 질문·선택 이력</text><text x="51" y="372" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">intake_questions / intake_answers</text><text x="51" y="392" font-family="Arial, Noto Sans KR, sans-serif" font-size="13" fill="#6d657a" text-anchor="start" font-weight="400">jobs · 공유 GPU 작업 큐</text><path d="M335 355 L410 355" fill="none" stroke="#817994" stroke-width="1.6" marker-end="url(#intake-architecture-arr)"/><text