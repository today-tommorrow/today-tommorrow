</style></head><body><header><div class="brand"><span>↗</span>다음<small>나에게 맞는 배움의 시작</small></div><button class="quiet" onclick="reset()">시연 처음부터</button></header><div class="demo">v0.8 화면 시안 · 질문은 구조화 JSON 시연 데이터, 교육은 가상 데이터 · 실제 Google 인증·파일 추출·링크 수집·Gemma는 미연결</div><div class="layout" id="layout"><aside class="sidebar" id="side"><span class="eyebrow">YOUR NEXT CHAPTER</span><h2>당신의 이야기로<br>시작하는 배움.</h2><p>먼저 듣고, 함께 정리할게요.<br>모든 입력이 끝나면 교육을 추천해요.</p><ol class="stages" id="steps"></ol><div class="context-title">함께 정리한 내용</div><div class="context-chips" id="context"></div></aside><main class="main" id="main"></main></div><div id="toast" class="toast hidden" role="status"></div><footer class="footer">입력은 이 브라우저 안에서만 사용됩니다. 새로고침하면 시연 입력이 사라집니다.</footer><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FIELDS={ai_data:'AI·데이터',software_cloud:'소프트웨어·클라우드',digital_content:'디지털콘텐츠·디자인',security_network:'보안·네트워크',robotics_manufacturing:'로봇·제조',semiconductor:'반도체',other:'직접 입력한 분야'};
const L={goal_known:'목표가 있어요',explore:'방향을 찾는 중',advance:'다음 단계로',beginner:'처음 시작',basic:'기초를 배운 경험',project:'개인 프로젝트 경험',work:'실무 활용 경험',foundation:'기초를 탄탄하게',portfolio:'보여줄 결과물',collaboration:'협업 경험',application:'혼자 적용하는 연습',depth:'더 깊은 학습',weekday_day:'평일 낮',evening_weekend:'저녁·주말',flexible:'시간 조정 가능',online:'온라인',offline:'오프라인',hybrid:'온·오프라인 병행',any:'방식 무관',unknown:'아직 미정',amount:'금액 입력',no_limit:'예산 제한 없음',soon:'가능하면 바로',one_to_three_months:'1~3개월 후',browse:'일정을 보고 결정',provided:'자료 첨부',none:'자료 없음'};
const names={entry_intent:'출발 상황',field_code:'관심 방향',custom_field:'직무·주제',experience:'현재 경험',previous_gap:'보완하고 싶은 점',learning_goal:'원하는 결과',availability:'가능한 시간',delivery_mode:'수강 방식',commute_region:'통학 범위',budget_status:'교육비 예산',budget_krw:'예산 금액',start_timing:'시작 시점',document_decision:'참고 자료'};
const examples=['파이썬 기초는 배웠는데 SQL은 처음이에요. 데이터 분석 포트폴리오를 만들고 싶고, 직장 때문에 주말에 온라인으로 배우고 싶어요. 예산은 20만원이에요.','프론트엔드로 취업하고 싶어요. 작은 개인 프로젝트는 해봤고, 이제 팀으로 서비스를 만들어 보고 싶어요. 평일 낮에 참여할 수 있어요.','아직 직무는 모르겠어요. 복잡한 정보를 보기 쉽게 정리하거나 화면을 만드는 일이 좋아요. 처음 배우는 거라 기초부터 시작하고 싶어요.'];
let a={},origins={},sources=[],proposals=[],step='login',editing=false,revision=0,proposalRevision=0,storyDraft='',lastResponse='',tab='file',loadingStage=0,timer=null,history=[];
const stages=['방향 찾기','경험 알아보기','배움의 목표','참여 조건'];
function val(k){return k==='budget_status'&&a[k]==='amount'?(Number(a.budget_krw).toLocaleString()+'원'):k==='field_code'&&a[k]==='other'?(a.custom_field||FIELDS.other):(FIELDS[a[k]]||L[a[k]]||a[k]||'미입력')}
function reset(){clearTimeout(timer);a={};origins={};sources=[];proposals=[];step='login';editing=false;revision=0;storyDraft='';lastResponse='';history=[];render()}
function login(){requestQuestion(currentTarget)}
function example(i){$('story').value=examples[i];storyDraft=examples[i];$('story').focus()}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function quoteFor(slot,text){const keys={field_code:/데이터|파이썬|개발|디자인|보안|네트워크/i,experience:/기초|프로젝트|실무|처음/,learning_goal:/포트폴리오|결과물|협업|팀으로|기초부터/,availability:/주말|저녁|퇴근|평일/,delivery_mode:/온라인|오프라인/,budget_status:/예산|교육비|부담|무료/,budget_krw:/예산|교육비|부담|무료/,start_timing:/시작|개월|달 후/};const chunks=text.split(/[,.!?\n]/).map(x=>x.trim()).filter(Boolean);return chunks.find(x=>keys[slot]?.test(x))||text;}
function parseText(text){let out=[];const put=(slot,value,label,quote)=>{if(a[slot]===value)return;const i=out.findIndex(p=>p.slot===slot);const p={id:'p'+out.length+'-'+slot,slot,value,label:label||L[value]||FIELDS[value]||value,quote:quote||quoteFor(slot,text),status:a[slot]!==undefined&&a[slot]!==value?'conflict':'proposed'};if(i>=0)out[i]=p;else out.push(p)};
 if(/데이터|파이썬|SQL|통계|머신러닝/i.test(text)){put('field_code','ai_data');put('entry_intent','goal_known')}
 else if(/프론트|백엔드|개발자|리액트|React|웹 개발|서버 개발/i.test(text)){put('field_code','software_cloud');put('entry_intent','goal_known')}
 else if(/디자인|화면을 만드는|정보를 보기 쉽게/i.test(text)){put('field_code','digital_content');put('entry_intent',/모르|아직/.test(text)?'explore':'goal_known')}
 else if(/보안|네트워크/.test(text)){put('field_code','security_network');put('entry_intent','goal_known')}
 if(/기초.{0,10}(배웠|해봤|공부했)/.test(text))put('experience','basic');else if(/프로젝트.{0,8}(해봤|만들었|했)/.test(text))put('experience','project');else if(/실무.{0,8}(활용|해봤|사용)/.test(text))put('experience','work');else if(/처음 배우|처음 시작|완전 처음/.test(text))put('experience','beginner');
 if(/포트폴리오|결과물/.test(text))put('learning_goal','portfolio');else if(/팀으로|협업/.test(text))put('learning_goal','collaboration');else if(/기초부터|기초를 탄탄/.test(text))put('learning_goal','foundation');
 if(/주말|저녁|퇴근 후/.test(text))put('availability','evening_weekend');else if(/평일 낮/.test(text))put('availability','weekday_day');
 if(/온라인/.test(text)&&/오프라인/.test(text))put('delivery_mode','hybrid');else if(/온라인/.test(text))put('delivery_mode','online');else if(/오프라인/.test(text))put('delivery_mode','offline');
 let budget=text.match(/(?:예산|교육비|부담)[^0-9]{0,12}([0-9,]+)\s*(만)?\s*원/);if(budget){put('budget_status','amount');put('budget_krw',Number(budget[1].replaceAll(',',''))*(budget[2]?10000:1),Number(budget[1].replaceAll(',',''))*(budget[2]?10000:1)+'원')}
 if(/무료만|돈을 쓸 수 없/.test(text)){put('budget_status','amount');put('budget_krw',0,'0원')}
 if(/바로 시작|당장 시작/.test(text))put('start_timing','soon');else if(/1~3개월|두 달 후|세 달 후/.test(text))put('start_timing','one_to_three_months');
 return out;}
function interpret(text){text=(text??$('story')?.value??$('free-text')?.value??'').trim();if(!text){toast('이야기를 적거나 선택 입력으로 이어가 주세요.');return}storyDraft=text;a.self_description=a.self_description&&a.self_description!==text?a.self_description+'\n'+text:text;revision++;proposalRevision=revision;proposals=parseText(text);step='interpret';lastResponse=proposals.length?'말씀하신 내용에서 아래 정보를 찾았어요. 맞는 항목만 반영해 주세요.':'이 문장만으로 확실히 정할 수 있는 항목이 적어요. 이야기는 그대로 두고 필요한 내용을 함께 정리할게요.';render()}
function applyInterpretation(){if(proposalRevision!==revision){toast('입력이 바뀌었어요. 최신 내용으로 다시 해석해 주세요.');return}for(const p of proposals){if($('check-'+p.id)?.checked){a[p.slot]=p.value;origins[p.slot]='문장 확인';delete selectedLabels[p.slot]}}if(a.field_code)a.field_confirmed=true;revision++;proposals=[];lastResponse='확인한 내용은 기억했어요. 아직 필요한 부분만 이어서 알려주세요.';continueInput()}
function pending(){let out=[];if(!a.entry_intent)out.push('entry');if(!a.field_code||a.field_code==='other'&&!a.custom_field)out.push('field');if(!a.document_decision)out.push('docs');if(!a.experience)out.push('experience');if(a.experience&&a.experience!=='beginner'&&!a.previous_gap)out.push('gap');if(!a.learning_goal)out.push('goal');if(!a.availability)out.push('time');if(!a.delivery_mode)out.push('mode');if(['offline','hybrid','any'].includes(a.delivery_mode)&&!a.commute_region)out.push('region');if(!a.budget_status||(a.budget_status==='amount'&&(!Number.isInteger(a.budget_krw)||a.budget_krw<0)))out.push('budget');if(!a.start_timing)out.push('timing');return out}
function continueInput(){step=pending()[0]||'review';editing=false;history.push(step);render()}
function skipStory(){lastResponse='선택으로도 충분히 알려줄 수 있어요. 답변에 맞춰 이어갈게요.';continueInput()}
function choose(k,v){a[k]=v;origins[k]='직접 선택';if(k==='field_code')a.field_confirmed=true;if(k==='experience'&&v==='beginner')delete a.previous_gap;if(k==='delivery_mode'&&!['offline','hybrid','any'].includes(v))delete a.commute_region;revision++;lastResponse=feedback(k,v);if(editing){editing=false;step=pending()[0]||'review';render()}else continueInput()}
function feedback(k,v){if(k==='experience'&&v==='basic')return val('field_code')+'의 기초 경험을 바탕으로, 이번에 더 해보고 싶은 내용을 살펴볼게요.';if(k==='previous_gap')return '“'+(L[v]||v)+'”을 이번 배움의 기준에 반영할게요.';if(k==='availability')return '“'+(L[v]||v)+'”을 기준으로 볼게요. 이제 참여 가능한 방식을 알려주세요.';if(k==='delivery_mode'&&v==='online')return '온라인을 선택했으니 통학 지역은 묻지 않을게요.';return '“'+(L[v]||FIELDS[v]||v)+'”으로 기록했어요.'}
function edit(s){editing=true;step=s;render()}
function back(){if(step==='results'||step==='loading'){clearTimeout(timer);step='review'}else if(editing){editing=false;step='review'}else if(step==='interpret')step='story';else if(step==='story')step='login';else{history.pop();step=history.pop()||'story'}render()}
function saveCustom(){const x=$('custom-field').value.trim();if(!x){toast('직무나 배우고 싶은 주제를 적어 주세요.');return}a.custom_field=x;a.field_code='other';a.field_confirmed=true;origins.custom_field='직접 입력';revision++;continueInput()}
function saveBudget(status){if(status==='amount'){const raw=$('budget').value;if(!raw||!Number.isFinite(Number(raw))||Number(raw)<0){toast('0원 이상의 금액을 적어 주세요.');return}a.budget_krw=Number(raw);origins.budget_krw='직접 입력'}else a.budget_krw=null;choose('budget_status',status)}
function saveRegion(){const v=$('region').value.trim();if(!v){toast('이동 가능한 범위를 적거나 미정을 선택해 주세요.');return}choose('commute_region',v)}

function demoCourses(){const f=a.field_code||'other',software=f==='software_cloud',data=f==='ai_data';if(!data&&!software)return [];const sql=data&&/SQL/i.test(a.self_description||'');const base=[{id:'a',source:'K-MOOC 형식',title:software?'웹 서비스의 구조와 기초':sql?'SQL로 데이터를 읽는 첫 실습':'파이썬으로 데이터를 다루는 기초',mode:'online',cost:0,time:'flexible',kind:'practice',fact:software?'웹의 요청·응답 구조와 간단한 구현 예제':'기초 문법을 적용하는 조회·분석 예제',unknown:'모집 상태와 실제 학습 기간',evidence:'가상 강좌 설명 1문단'},{id:'b',source:'고용24 형식',title:software?'팀으로 완성하는 프론트엔드 프로젝트':'데이터 분석 포트폴리오 프로젝트',mode:'online',cost:180000,time:'evening_weekend',kind:'portfolio',fact:software?'역할을 나눠 화면을 구현하고 함께 결과물을 정리':'데이터 정리부터 분석 결과 발표까지 한 프로젝트로 실습',unknown:'개인별 최종 자비부담금과 선수지식',evidence:'가상 훈련과정 설명 2문단'},{id:'c',source:'고용24 형식',title:software?'주간 집중 웹 개발 과정':'주간 집중 데이터 분석 과정',mode:'offline',cost:500000,time:'weekday_day',kind:'intensive',fact:'평일 낮 대면 수업',unknown:'모집 상태',evidence:'가상 시간표'}];return base.filter(c=>!(a.availability==='evening_weekend'&&c.time==='weekday_day')&&!(a.delivery_mode==='online'&&c.mode==='offline')&&!(a.budget_status==='amount'&&c.cost>a.budget_krw)).sort((x,y)=>{let score=c=>(a.learning_goal==='portfolio'&&c.kind==='portfolio'?3:0)+(a.learning_goal==='collaboration'&&c.kind==='portfolio'?3:0)+(a.experience==='beginner'&&c.kind==='practice'?4:0);return score(y)-score(x)||x.id.localeCompare(y.id)})}

function review(){const pairs=Object.entries(STEP_SLOT).filter(([s,k])=>s!=='docs'&&a[k]!==undefined);return '<div class="review-grid">'+pairs.map(([s,k])=>'<div class="review"><button class="edit" onclick="edit(\''+s+'\')">수정</button><div class="label">'+names[k]+'</div><p>'+esc(selectedLabels[k]||val(k))+'</p><small class="note">'+esc(origins[k]||'확인한 입력')+'</small></div>').join('')+'</div><div class="source"><button class="edit" onclick="edit(\'docs\')">수정</button><b>참고 자료 '+sources.length+'개</b>'+sources.map(s=>'<small>'+esc(s.name)+'</small>').join('')+'</div>'+(a.self_description?'<div class="source"><small>직접 알려준 내용</small><p>'+esc(a.self_description)+'</p></div>':'')+'<div class="actions"><button class="primary" onclick="submitProfile()">입력 완료 · 교육 추천받기 →</button></div><p class="note">전체 내용을 확인한 뒤 교육을 추천합니다.</p>'}
function render(){if(!['question','question_loading'].includes(step)){renderLegacy();return}$('side').classList.remove('hidden');$('layout').style.display='';const g=group();$('steps').innerHTML=stages.map((s,i)=>'<li class="'+(g===i?'active':i<g?'complete':'')+'"><span>'+(i<g?'✓':i+1)+'</span>'+s+'</li>').join('');$('context').innerHTML=['field_code','experience','learning_goal','availability','delivery_mode'].filter(k=>a[k]).map(k=>'<span class="context-chip">'+esc(val(k))+'</span>').join('')||'<p>선택한 내용을 여기에 모아둘게요.</p>';let body;if(step==='question_loading'){body='<h1 id="heading" tabindex="-1">'+(revision?'다음 질문을 준비하고 있어요.':'가볍게 고를 수 있는 질문부터 시작해요.')+'</h1><p class="sub">'+(revision?'지금까지 알려준 내용을 이어갈게요.':'편한 선택부터 알려주세요.')+'</p><div class="option" aria-busy="true">질문과 선택지를 준비 중이에요…</div>'}else{const q=currentQuestion,d=q.draft;body='<h1 id="heading" tabindex="-1">'+esc(d.question)+'</h1><p class="sub">'+esc(d.helper_text)+'</p>'+(d.acknowledgement?'<div class="bubble" role="status">'+esc(d.acknowledgement)+'</div>':'')+'<div class="options">'+q.options.map((o,i)=>'<button class="option" onclick="answerQuestion(\''+o.id+'\')"><span class="number">'+(i+1)+'</span><span><b>'+esc(o.label)+'</b>'+(o.description?'<small>'+esc(o.description)+'</small>':'')+'</span><span class="arrow">→</span></button>').join('')+'</div>'+(revision?'<details class="free-text"><summary>선택지에 없다면 직접 알려줄게요</summary><label class="note" for="free-text">지금 질문에 대한 답변</label><textarea id="free-text" placeholder="선택지에 없는 내용만 편하게 알려주세요."></textarea><button class="secondary" onclick="directQuestionText()">입력한 내용 확인하기</button></details>':'')}$('main').innerHTML='<div class="topline"><button class="quiet" onclick="back()">← 이전</button><span>로그인됨 · 시연 계정</span></div><div class="progress"><div class="fill" style="width:'+((g+1)*20)+'%"></div></div><section class="question">'+body+'</section>';$('heading').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}
render();
</script></body></html>
