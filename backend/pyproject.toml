[project]
name = "today-tommorrow-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "google-auth[requests]>=2.62,<3",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
